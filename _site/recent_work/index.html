<dialog class="artwork-dialog" aria-label="Artwork carousel">
  <button class="artwork-dialog__close" type="button" data-artwork-close aria-label="Close carousel">
    <span aria-hidden="true">&times;</span>
  </button>
  <div class="artwork-dialog__carousel">
    <button class="artwork-dialog__control" type="button" data-artwork-previous aria-label="Previous image">
      <span aria-hidden="true">&lsaquo;</span>
    </button>
    <div class="artwork-dialog__content">
      <img class="artwork-dialog__image" data-artwork-image src="" alt="">
      <div class="artwork-dialog__details">
        <dl>
          <dd data-artwork-title></dd>
          <dd data-artwork-medium></dd>
          <dd data-artwork-dimensions></dd>
          <dd data-artwork-year></dd>
        </dl>
      </div>
    </div>
    <button class="artwork-dialog__control" type="button" data-artwork-next aria-label="Next image">
      <span aria-hidden="true">&rsaquo;</span>
    </button>
  </div>
  <p class="artwork-dialog__count" aria-live="polite">
    <span data-artwork-current></span> / 16
  </p>
</dialog>

<script>
  (() => {
    const thumbnails = Array.from(document.querySelectorAll('.artwork-thumbnail'));
    const dialog = document.querySelector('.artwork-dialog');
    if (!dialog || thumbnails.length === 0) return;

    const image = dialog.querySelector('[data-artwork-image]');
    const counter = dialog.querySelector('[data-artwork-current]');
    const details = {
      title: dialog.querySelector('[data-artwork-title]'),
      medium: dialog.querySelector('[data-artwork-medium]'),
      dimensions: dialog.querySelector('[data-artwork-dimensions]'),
      year: dialog.querySelector('[data-artwork-year]')
    };
    let currentIndex = 0;

    const showArtwork = (index) => {
      currentIndex = (index + thumbnails.length) % thumbnails.length;
      const thumbnail = thumbnails[currentIndex];
      image.src = thumbnail.dataset.artworkSrc;
      image.alt = thumbnail.dataset.artworkTitle;
      details.title.textContent = thumbnail.dataset.artworkTitle;
      details.medium.textContent = thumbnail.dataset.artworkMedium;
      details.dimensions.textContent = thumbnail.dataset.artworkDimensions;
      details.year.textContent = thumbnail.dataset.artworkYear;
      counter.textContent = String(currentIndex + 1);
    };

    thumbnails.forEach((thumbnail, index) => {
      thumbnail.addEventListener('click', () => {
        showArtwork(index);
        dialog.showModal();
      });
    });

    dialog.querySelector('[data-artwork-close]').addEventListener('click', () => {
      dialog.close();
    });
    dialog.querySelector('[data-artwork-previous]').addEventListener('click', () => {
      showArtwork(currentIndex - 1);
    });
    dialog.querySelector('[data-artwork-next]').addEventListener('click', () => {
      showArtwork(currentIndex + 1);
    });
    dialog.addEventListener('keydown', (event) => {
      if (event.key === 'ArrowLeft') showArtwork(currentIndex - 1);
      if (event.key === 'ArrowRight') showArtwork(currentIndex + 1);
    });
    dialog.addEventListener('click', (event) => {
      if (event.target === dialog) dialog.close();
    });
  })();
</script>

    <!--

  See: <https://github.com/christian-fei/Simple-Jekyll-Search>
-->





<script>
  
  document.addEventListener('DOMContentLoaded', () => {
    SimpleJekyllSearch({
      searchInput: document.getElementById('search-input'),
      resultsContainer: document.getElementById('search-results'),
      json: '/assets/js/data/search.json',
      searchResultTemplate: '  <article class="px-1 px-sm-2 px-lg-4 px-xl-0">    <header>      <h2><a href="{url}">{title}</a></h2>      <div class="post-meta d-flex flex-column flex-sm-row text-muted mt-1 mb-1">        {categories}        {tags}      </div>    </header>    <p>{content}</p>  </article>',
      noResultsText: '<p class="mt-5">Oops! No results found.</p>',
      templateMiddleware: function(prop, value, template) {
        if (prop === 'categories') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div class="me-sm-4"><i class="far fa-folder fa-fw"></i>${value}</div>`;
          }
        }

        if (prop === 'tags') {
          if (value === '') {
            return `${value}`;
          } else {
            return `<div><i class="fa fa-tag fa-fw"></i>${value}</div>`;
          }
        }
      }
    });
  });
</script>
